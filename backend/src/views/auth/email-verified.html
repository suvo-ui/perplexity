<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Email Verified</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fafafa;
        color: #18181b;
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: 100%;
        max-width: 480px;
        padding: 48px 40px;
        text-align: center;
        background: white;
        border: 1px solid #e4e4e7;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      }

      .icon {
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
        border-radius: 50%;
        background: #dcfce7;
        color: #16a34a;
        font-size: 32px;
        font-weight: bold;
      }

      h1 {
        margin-bottom: 12px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin-bottom: 28px;
        color: #71717a;
        font-size: 16px;
        line-height: 1.6;
      }

      .button {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 8px;
        background: #18181b;
        color: white;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        transition: background 0.2s ease;
      }

      .button:hover {
        background: #27272a;
      }

      .footer {
        margin-top: 32px;
        margin-bottom: 0;
        color: #a1a1aa;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <div class="icon">✓</div>

      <h1>Email Verified Successfully</h1>

      <p>
        Your email address has been successfully verified. Your account is now
        ready to use.
      </p>

      <a class="button" href="http://localhost:3000/login">
        Continue to Login
      </a>

      <p class="footer">
        Best regards,<br />
        The Perplexity Team
      </p>
    </main>
  </body>
</html>
