<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verification Link Expired</title>
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #f8d7da;
        color: #721c24;
        font-family: Arial, sans-serif;
      }

      .container {
        text-align: center;
        padding: 20px;
        border: 1px solid #f5c6cb;
        border-radius: 5px;
        background-color: #f8d7da;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 10px;
      }

      p {
        font-size: 16px;
        margin-bottom: 20px;
      }

      a {
        color: #721c24;
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Email Verification Link Expired</h1>
      <p>
        Your email verification link has expired. Please request a new
        verification email.
      </p>
      <a href="http://localhost:3000/resend-verification"
        >Resend Verification Email</a
      >
    </div>
  </body>
</html>
